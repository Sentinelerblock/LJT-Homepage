name: Build and deploy LJT-Homepage

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Minify theme JavaScript
        run: |
          npm install --global uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Verify requested pages and saved publications
        run: |
          ruby -rcgi <<'RUBY'
          expected_pages = ['_site/index.html', '_site/publications/index.html']
          actual_pages = Dir.glob('_site/**/*.html').sort
          abort "Unexpected pages: #{actual_pages.inspect}" unless actual_pages == expected_pages.sort
          titles = [
            'SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond',
            'On the Perception Bottleneck of VLMs for Chart Understanding',
            'On the Universal Truthfulness Hyperplane Inside LLMs',
            'In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation',
            'C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models',
            'Composing Parameter-Efficient Modules with Arithmetic Operations'
          ]
          expected_pages.each do |path|
            html = File.read(path)
            text = CGI.unescapeHTML(html.gsub(/<[^>]*>/, ' ')).gsub(/\s+/, ' ')
            titles.each { |title| abort "Missing publication in #{path}: #{title}" unless text.include?(title) }
            ['Your Name', 'Your Sidebar Name', 'Red Brick University', 'none@example.org', 'Paper Title Number'].each do |placeholder|
              abort "Template placeholder in #{path}: #{placeholder}" if text.include?(placeholder)
            end
          end
          homepage = File.read('_site/index.html')
          %w[about education research-experience publications skills contact].each do |id|
            abort "Missing homepage section: #{id}" unless homepage.include?("id=\"#{id}\"")
          end
          abort 'Missing saved contact email' unless homepage.include?('mailto:jliugi@connect.ust.hk')
          abort 'Incorrect GitHub profile link' unless homepage.include?('https://github.com/Vicent0205')
          abort 'Incorrect project-site navigation' unless homepage.include?('/LJT-Homepage/#publications')
          puts 'Verified: only the two existing content pages, all six publications on both, and saved contact details.'
          RUBY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages availability
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/pages")
          case "$status" in
            200)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo '::warning::The homepage build and content checks passed, but GitHub Pages is not enabled. Initial enablement requires repository-admin access in Settings > Pages > Source > GitHub Actions. The verified site artifact has been uploaded; deployment is skipped.'
              ;;
            *)
              echo "::error::Unable to check GitHub Pages availability (HTTP $status)."
              exit 1
              ;;
          esac
      - name: Configure GitHub Pages
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        if: steps.pages_status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
